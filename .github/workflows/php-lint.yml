name: PHP Lint

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

# A newer revision supersedes validation/artifacts for the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP files
        run: |
          find wordpress -name "*.php" -print0 | xargs -0 -r -n1 -P2 php -l
